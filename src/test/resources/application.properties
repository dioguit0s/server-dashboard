# Perfil de teste: credenciais fixas e banco em memoria (nao toca em ./data)
dashboard.admin.username=admin
dashboard.admin.password=test-password
# Um banco por contexto de teste: com usuarios persistidos, um nome fixo faria o admin criado por
# um contexto sobreviver para o seguinte (DB_CLOSE_DELAY=-1 mantem o banco vivo enquanto a JVM
# roda), e cenarios com credenciais diferentes passariam a interferir uns nos outros.
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# WebSocket: origem fixa, para que os testes nao dependam do curinga (que so' sobe em dev)
dashboard.websocket.allowed-origin-patterns=http://localhost:8080
