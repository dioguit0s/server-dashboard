# Perfil de desenvolvimento: origens do WebSocket limitadas à máquina local, para que o curinga
# ('*') não seja necessário nem em dev. Ative com SPRING_PROFILES_ACTIVE=dev ou
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
dashboard.websocket.allowed-origin-patterns=${DASHBOARD_WS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
