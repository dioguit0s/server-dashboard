<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Armazenamento</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="app-shell">
    <div th:replace="~{home/fragments/layout :: sidebar('overview')}"></div>

    <main class="app-main">
        <div th:replace="~{home/fragments/layout :: topbar}"></div>

        <span class="eyebrow">// armazenamento</span>
        <h1 class="page-heading">Detalhes do Armazenamento</h1>

        <div class="row g-4 mb-5">
            <div class="col-12 col-lg-6">
                <h5 class="section-subheading mb-3"><i class="bi bi-device-hdd me-2" aria-hidden="true"></i>Discos Físicos (Hardware)</h5>
                <div class="card card-metric h-100">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover table-borderless mb-0">
                                <thead class="border-bottom border-metric-table">
                                <tr>
                                    <th class="ps-4 py-3 small text-uppercase">Modelo</th>
                                    <th class="py-3 small text-uppercase">Serial</th>
                                    <th class="pe-4 py-3 small text-uppercase text-end">Tamanho</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="disk : ${hardwareDisksList}" class="align-middle">
                                    <td class="ps-4 py-3 fw-medium" style="color: var(--text-heading);" th:text="${disk.diskModel}"></td>
                                    <td class="py-3 text-end small text-white-50 font-monospace" th:text="${disk.serialNumber}"></td>
                                    <td class="pe-4 py-3 text-end font-monospace text-disk-accent" th:text="${disk.diskSize}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <h5 class="section-subheading mb-3"><i class="bi bi-folder2-open me-2" aria-hidden="true"></i>Partições e Volumes</h5>
                <div class="card card-metric h-100">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover table-borderless mb-0">
                                <thead class="border-bottom border-metric-table">
                                <tr>
                                    <th class="ps-4 py-3 small text-uppercase">Mount</th>
                                    <th class="py-3 small text-uppercase">Tipo</th>
                                    <th class="pe-4 py-3 small text-uppercase text-end">Livre / Total</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="volume : ${logicalVolumesList}" class="align-middle">
                                    <td class="ps-4 py-3 fw-medium">
                                        <span th:text="${volume.mountPoint}"></span>
                                    </td>
                                    <td class="py-3"><span class="badge badge-soft" th:text="${volume.fileSystemType}"></span></td>
                                    <td class="pe-4 py-3 text-end font-monospace small">
                                        <span style="color: var(--text-heading);" th:text="${volume.usableSpace}"></span> /
                                        <span class="text-white-50" th:text="${volume.totalSpace}"></span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card card-metric">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="d-flex align-items-center gap-2">
                        <div class="icon-box icon-box-metric" style="width: 24px; height: 24px;">
                            <i class="bi bi-device-hdd" style="font-size: 0.8rem;" aria-hidden="true"></i>
                        </div>
                        <span class="card-title-label m-0">Usado vs Livre (Geral)</span>
                    </div>
                </div>
                <div id="diskChartContainer" style="height: 300px; width: 100%;" th:data-disk-int="${diskInt}">
                    <canvas id="diskPieChart"></canvas>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/home/js/websocket-utils.js}"></script>
<script th:src="@{/home/js/disk-details.js}"></script>

</body>
</html>
