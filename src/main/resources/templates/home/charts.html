<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de Performance</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="app-shell">
    <div th:replace="~{home/fragments/layout :: sidebar('history')}"></div>

    <main class="app-main">
        <div th:replace="~{home/fragments/layout :: topbar}"></div>

        <span class="eyebrow">// histórico</span>
        <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mb-4">
            <h1 class="page-heading m-0">Performance do Servidor</h1>
            <div class="btn-group flex-wrap" role="group" aria-label="Intervalo de histórico">
                <button type="button" class="btn btn-outline-primary btn-sm active" id="buttonRealTime">Tempo Real</button>
                <button type="button" class="btn btn-outline-primary btn-sm" id="buttonLastHour">Última Hora</button>
                <button type="button" class="btn btn-outline-primary btn-sm" id="buttonLastDay">Últimas 24h</button>
                <button type="button" class="btn btn-outline-primary btn-sm" id="buttonLastWeek">Últimas Semana</button>
            </div>
        </div>

        <div class="row g-4">

            <!-- CPU Chart -->
            <div class="col-12 col-lg-8">
                <div class="card card-metric h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="d-flex align-items-center gap-2">
                                <div class="icon-box icon-box-metric" style="width: 24px; height: 24px;">
                                    <i class="bi bi-cpu" style="font-size: 0.8rem;" aria-hidden="true"></i>
                                </div>
                                <span class="card-title-label m-0">Carga da CPU</span>
                            </div>
                            <h4 id="cpuValue" class="m-0 fw-normal font-monospace" style="color: var(--text-heading);">--%</h4>
                        </div>
                        <div style="height: 300px; width: 100%;">
                            <canvas id="cpuChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar Stats -->
            <div class="col-12 col-lg-4">
                <div class="d-flex flex-column gap-4 h-100">

                    <div class="card card-metric flex-grow-1">
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="card-title-label m-0">Uso de RAM</span>
                                <h5 id="ramValue" class="m-0 font-monospace" style="color: var(--text-heading);">--%</h5>
                            </div>
                            <div class="flex-grow-1" style="min-height: 150px;">
                                <canvas id="ramChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="card card-metric flex-grow-1">
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="card-title-label m-0">Temperatura</span>
                                <h5 id="tempValue" class="m-0 font-monospace" style="color: var(--text-heading);">--°C</h5>
                            </div>
                            <div class="flex-grow-1" style="min-height: 150px;">
                                <canvas id="tempChart"></canvas>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/home/js/websocket-utils.js}"></script>
<script th:src="@{/home/js/charts.js}"></script>

</body>
</html>
