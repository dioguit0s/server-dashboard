<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Processador</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="app-shell">
    <div th:replace="~{home/fragments/layout :: sidebar('overview')}"></div>

    <main class="app-main">
        <div th:replace="~{home/fragments/layout :: topbar}"></div>

        <span class="eyebrow">// processador</span>
        <h1 class="page-heading">Detalhes do Processador</h1>

        <div class="row g-4 mb-4">
            <div class="col-12 col-lg-8">
                <div class="card card-metric h-100">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Modelo e Fabricante</div>
                        <div class="fw-medium fs-5" style="color: var(--text-heading);" th:text="${processorName}">--</div>
                        <div class="text-muted small mt-1">
                            <span th:text="${processorVendor}">--</span> |
                            Microarquitetura: <span th:text="${processorMicroarchitecture}">--</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card card-metric h-100">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Velocidade Máxima</div>
                        <div class="fw-medium fs-4 font-monospace" style="color: var(--text-heading);" th:text="${processorMaximumFrequency}">--</div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card card-metric h-100 border-accent-cobalt">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Núcleos Físicos (Cores)</div>
                        <div class="fw-medium fs-4 font-monospace" style="color: var(--text-heading);" th:text="${physicalCores}">--</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card card-metric h-100 border-accent-signal">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Núcleos Lógicos (Threads)</div>
                        <div class="fw-medium fs-4 font-monospace" style="color: var(--text-heading);" th:text="${logicalCores}">--</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card card-metric h-100 border-accent-cyan">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Média de Carga (1 min)</div>
                        <div class="fw-medium fs-4 font-monospace" style="color: var(--text-heading);" th:text="${systemLoadAverage}">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card card-metric">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="d-flex align-items-center gap-2">
                        <div class="icon-box icon-box-metric" style="width: 24px; height: 24px;">
                            <i class="bi bi-cpu" style="font-size: 0.8rem;" aria-hidden="true"></i>
                        </div>
                        <span class="card-title-label m-0">Uso da CPU em tempo real</span>
                    </div>
                    <h4 id="cpuDetailedValue" class="m-0 fw-normal font-monospace" style="color: var(--text-heading);">--%</h4>
                </div>
                <div style="height: 300px; width: 100%;">
                    <canvas id="cpuDetailedChart"></canvas>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/home/js/websocket-utils.js}"></script>
<script th:src="@{/home/js/cpu-details.js}"></script>

</body>
</html>
