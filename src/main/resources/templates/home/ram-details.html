<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes da Memória RAM</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="app-shell">
    <div th:replace="~{home/fragments/layout :: sidebar('overview')}"></div>

    <main class="app-main">
        <div th:replace="~{home/fragments/layout :: topbar}"></div>

        <span class="eyebrow">// memória</span>
        <h1 class="page-heading">Detalhes da Memória RAM</h1>

        <div class="row g-4 mb-4">
            <div class="col-12 col-md-4">
                <div class="card card-metric h-100">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Uso da RAM</div>
                        <div class="fw-normal fs-3 font-monospace" style="color: var(--text-heading);">
                            <span id="ramPercentValue" th:text="${ramPercent}">0</span>%
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card card-metric h-100">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Sistema (Física)</div>
                        <div class="fw-normal" style="color: var(--text-body-strong);">
                            Total: <span id="ramTotalValue" th:text="${ramTotal}">--</span><br>
                            Usado: <span id="ramUsedValue" th:text="${ramUsado}">--</span><br>
                            Livre: <span id="ramFreeValue" th:text="${ramLivre}">--</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card card-metric h-100 border-accent-cyan">
                    <div class="card-body p-4">
                        <div class="card-title-label mb-2">Memória Virtual (Swap)</div>
                        <div class="fw-normal" style="color: var(--text-body-strong);">
                            Total: <span th:text="${swapInformation.totalSwap}">--</span><br>
                            Usado: <span th:text="${swapInformation.usedSwap}">--</span><br>
                            Livre: <span th:text="${swapInformation.freeSwap}">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h5 class="section-subheading mt-5 mb-3"><i class="bi bi-motherboard me-2" aria-hidden="true"></i>Pentes Instalados (DIMM)</h5>
        <div class="card card-metric mb-5">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover table-borderless mb-0">
                        <thead class="border-bottom border-metric-table">
                        <tr>
                            <th class="ps-4 py-3 small text-uppercase">Slot</th>
                            <th class="py-3 small text-uppercase">Fabricante</th>
                            <th class="py-3 small text-uppercase">Tipo</th>
                            <th class="py-3 small text-uppercase">Capacidade</th>
                            <th class="pe-4 py-3 small text-uppercase text-end">Frequência</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(physicalMemoryList)}">
                            <td colspan="5" class="text-center text-white-50 py-4">Informação de hardware não disponível neste OS</td>
                        </tr>
                        <tr th:each="memory : ${physicalMemoryList}" class="align-middle">
                            <td class="ps-4 py-3 fw-medium" th:text="${memory.bankLabel}"></td>
                            <td class="py-3" th:text="${memory.manufacturer}"></td>
                            <td class="py-3"><span class="badge badge-soft" th:text="${memory.memoryType}"></span></td>
                            <td class="py-3 font-monospace" th:text="${memory.capacity}"></td>
                            <td class="pe-4 py-3 text-end font-monospace" th:text="${memory.clockSpeed}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card card-metric">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="d-flex align-items-center gap-2">
                        <div class="icon-box icon-box-metric" style="width: 24px; height: 24px;">
                            <i class="bi bi-memory" style="font-size: 0.8rem;" aria-hidden="true"></i>
                        </div>
                        <span class="card-title-label m-0">Uso da RAM em tempo real</span>
                    </div>
                    <h4 id="ramDetailedValue" class="m-0 fw-normal font-monospace" style="color: var(--text-heading);">--%</h4>
                </div>
                <div style="height: 300px; width: 100%;">
                    <canvas id="ramDetailedChart"></canvas>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/home/js/websocket-utils.js}"></script>
<script th:src="@{/home/js/ram-details.js}"></script>

</body>
</html>
