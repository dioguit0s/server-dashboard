<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <title>Containers Docker</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="app-shell">
    <div th:replace="~{home/fragments/layout :: sidebar('containers')}"></div>

    <main class="app-main">
        <div th:replace="~{home/fragments/layout :: topbar}"></div>

        <span class="eyebrow">// containers</span>
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
            <h1 class="page-heading m-0">Painel de Containers</h1>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="badge badge-signal">Docker Engine</span>
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="stateFilter" id="filterAll" value="all" checked>
                    <label class="btn btn-outline-secondary btn-sm" for="filterAll">Todos</label>
                    <input type="radio" class="btn-check" name="stateFilter" id="filterRunning" value="running">
                    <label class="btn btn-outline-secondary btn-sm" for="filterRunning">Running</label>
                    <input type="radio" class="btn-check" name="stateFilter" id="filterStopped" value="stopped">
                    <label class="btn btn-outline-secondary btn-sm" for="filterStopped">Parados</label>
                </div>
            </div>
        </div>

        <div id="dockerUnavailableBanner" class="alert alert-warning d-none mb-4" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Docker Engine indisponível ou sem permissão.
        </div>

        <div class="card card-metric">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover table-borderless mb-0">
                        <thead>
                        <tr class="border-bottom border-metric-table">
                            <th class="ps-4 py-3 small fw-semibold text-uppercase">Container</th>
                            <th class="py-3 small fw-semibold text-uppercase">Status</th>
                            <th class="py-3 small fw-semibold text-uppercase text-end">CPU %</th>
                            <th class="py-3 small fw-semibold text-uppercase text-end">RAM %</th>
                            <th class="py-3 small fw-semibold text-uppercase text-end pe-4">Ações</th>
                        </tr>
                        </thead>
                        <tbody id="containersTableBody">
                        <tr>
                            <td colspan="5" class="text-center text-white-50 py-5">Aguardando telemetria do Docker...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:src="@{/home/js/websocket-utils.js}"></script>
<script th:src="@{/home/js/csrf-utils.js}"></script>
<script th:src="@{/home/js/containers.js}"></script>

</body>
</html>
