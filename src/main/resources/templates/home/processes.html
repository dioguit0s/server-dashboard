<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Top Processos</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="app-shell">
    <div th:replace="~{home/fragments/layout :: sidebar('processes')}"></div>

    <main class="app-main">
        <div th:replace="~{home/fragments/layout :: topbar}"></div>

        <span class="eyebrow">// processos</span>
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
            <h1 class="page-heading m-0">Top Processos</h1>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="badge badge-signal">Tempo real</span>
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="sortBy" id="sortCpu" value="cpu" checked>
                    <label class="btn btn-outline-secondary btn-sm" for="sortCpu">
                        <i class="bi bi-cpu me-1"></i> CPU
                    </label>
                    <input type="radio" class="btn-check" name="sortBy" id="sortRam" value="ram">
                    <label class="btn btn-outline-secondary btn-sm" for="sortRam">
                        <i class="bi bi-memory me-1"></i> RAM
                    </label>
                </div>
            </div>
        </div>

        <div class="card card-metric">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover table-borderless mb-0">
                        <thead>
                            <tr class="border-bottom border-metric-table">
                                <th class="ps-4 py-3 small fw-semibold text-uppercase">#</th>
                                <th class="py-3 small fw-semibold text-uppercase">Processo</th>
                                <th class="py-3 small fw-semibold text-uppercase">PID</th>
                                <th class="py-3 small fw-semibold text-uppercase text-end pe-4">
                                    <i class="bi bi-cpu me-1"></i> CPU %
                                </th>
                                <th class="py-3 small fw-semibold text-uppercase text-end pe-4">
                                    <i class="bi bi-memory me-1"></i> RAM %
                                </th>
                                <th class="py-3 small fw-semibold text-uppercase text-end pe-4">Memória</th>
                            </tr>
                        </thead>
                        <tbody id="processesTableBody">
                            <tr>
                                <td colspan="6" class="text-center text-white-50 py-5">Aguardando conexão...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:src="@{/home/js/websocket-utils.js}"></script>
<script th:src="@{/home/js/processes.js}"></script>

</body>
</html>
