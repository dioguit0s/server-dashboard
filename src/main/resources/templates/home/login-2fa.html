<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificação em duas etapas — Server Dashboard</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="container py-5" style="position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center;">
    <div class="row justify-content-center w-100 m-0">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">

            <div class="d-flex align-items-center gap-2 justify-content-center mb-4">
                <div class="sidebar-brand-mark" aria-hidden="true">S</div>
                <div class="sidebar-brand-text" style="font-size: 20px;">Server<span class="dim">Dash</span></div>
            </div>

            <div class="card card-metric">
                <div class="card-body p-4 p-md-5">
                    <div class="mb-4">
                        <span class="eyebrow">// segundo_fator</span>
                        <h4 class="m-0 section-subheading">Verificação em duas etapas</h4>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>código inválido ou já utilizado.
                    </div>

                    <p class="text-muted" style="font-size: 13px;">
                        Digite o código de 6 dígitos do seu aplicativo autenticador. Se você perdeu o
                        acesso a ele, use um dos códigos de recuperação.
                    </p>

                    <form th:action="@{/login/2fa}" method="post" class="login-form">
                        <div class="mb-4">
                            <label for="code" class="form-label card-title-label">// código</label>
                            <input type="text" id="code" name="code" class="form-control form-control-theme"
                                   placeholder="123456" required autofocus autocomplete="one-time-code"
                                   inputmode="text" maxlength="20">
                        </div>
                        <button type="submit" class="btn btn-primary btn-theme w-100 py-2">
                            Verificar ▸
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/login}" class="text-decoration-none" style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px; color: var(--text-label);">
                    ◂ recomeçar o login
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
