<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Server Dashboard</title>
    <th:block th:replace="~{home/fragments/layout :: head-assets}"></th:block>
</head>
<body>

<th:block th:replace="~{home/fragments/layout :: bg-fx}"></th:block>

<div class="container py-5" style="position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center;">
    <div class="row justify-content-center w-100 m-0">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">

            <!-- Marca -->
            <div class="d-flex align-items-center gap-2 justify-content-center mb-4">
                <div class="sidebar-brand-mark" aria-hidden="true">S</div>
                <div class="sidebar-brand-text" style="font-size: 20px;">Server<span class="dim">Dash</span></div>
            </div>

            <div class="card card-metric">
                <div class="card-body p-4 p-md-5">
                    <div class="mb-4">
                        <span class="eyebrow">// acesso_restrito</span>
                        <h4 class="m-0 section-subheading">Acesso Admin</h4>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>chave inválida — usuário ou senha incorretos.
                    </div>

                    <div th:if="${param.expired}" class="alert alert-warning mb-4" role="alert">
                        <i class="bi bi-clock-history me-2"></i>a verificação em duas etapas expirou — entre novamente.
                    </div>

                    <div th:if="${param.blocked}" class="alert alert-warning mb-4" role="alert">
                        <i class="bi bi-shield-lock me-2"></i>muitas tentativas — acesso temporariamente bloqueado. tente novamente mais tarde.
                    </div>

                    <form th:action="@{/login}" method="post" class="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label card-title-label">// usuário</label>
                            <input type="text" id="username" name="username" class="form-control form-control-theme" placeholder="operador" required autofocus autocomplete="username">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label card-title-label">// access_key</label>
                            <input type="password" id="password" name="password" class="form-control form-control-theme" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-theme w-100 py-2">
                            Entrar ▸
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="text-decoration-none" style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px; color: var(--text-label);">
                    ◂ voltar ao painel
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
