spring.application.name=server-dashboard
server.forward-headers-strategy=framework
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
# Importar o arquivo .env (optional: evita erro se o arquivo nao existir, ex: em producao)
spring.config.import=optional:file:.env[.properties]
# Credenciais (carregadas do .env ou variaveis de ambiente)
dashboard.admin.username=${DASHBOARD_ADMIN_USERNAME:admin}
# Preferencial: hash BCrypt pronto (veja o README para gerar). Tem precedencia sobre a senha em texto puro.
dashboard.admin.password-hash=${DASHBOARD_ADMIN_PASSWORD_HASH:}
# Compatibilidade: senha em texto puro, convertida em hash na inicializacao (emite WARN).
dashboard.admin.password=${DASHBOARD_ADMIN_PASSWORD:}
# Configuracoes do Banco de Dados H2
spring.datasource.url=jdbc:h2:file:./data/metrics-database;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# WebSocket SockJS: origens aceitas no handshake. O padrão * só sobe com um perfil de
# desenvolvimento ativo (ex.: SPRING_PROFILES_ACTIVE=dev) ou com a liberação explícita abaixo;
# fora disso a aplicação não inicia. Ex. de produção: https://meudominio.com,http://localhost:8080
dashboard.websocket.allowed-origin-patterns=${DASHBOARD_WS_ORIGINS:*}
# Libera o curinga conscientemente (ex.: instância só acessível em LAN fechada). Emite WARN.
dashboard.websocket.allow-wildcard-origins=${DASHBOARD_WS_ALLOW_WILDCARD:false}
# Retenção de métricas históricas no H2 (dias); limpeza diária remove registros mais antigos
dashboard.metrics.retention-days=${DASHBOARD_METRICS_RETENTION_DAYS:30}
# O AuthenticationProvider e' declarado explicitamente (SecurityConfig) para envolver a checagem de
# 2FA, e o Spring Security avisa que, por isso, nao usara o UserDetailsService para montar um
# provider automatico. E' exatamente a intencao — o aviso a cada boot so' confunde.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
# Exige 2FA de todo usuario com papel ADMIN: enquanto nao ativarem, eles so' conseguem chegar a
# tela da propria conta. Desligado por padrao — ligar sem que o admin possa escanear o QR agora
# tranca o dono para fora do proprio dashboard.
dashboard.security.totp.required-for-admin=${DASHBOARD_TOTP_REQUIRE_ADMIN:false}
# Rate limiting do login (protecao contra brute-force)
dashboard.security.login.max-attempts=${DASHBOARD_LOGIN_MAX_ATTEMPTS:5}
dashboard.security.login.lockout-minutes=${DASHBOARD_LOGIN_LOCKOUT_MINUTES:15}
# Trava global de reserva: total de falhas de qualquer IP antes de travar o login inteiro (0 desativa)
dashboard.security.login.global-max-attempts=${DASHBOARD_LOGIN_GLOBAL_MAX_ATTEMPTS:25}
# Teto de IPs rastreados em memoria (X-Forwarded-For e' controlado pelo cliente)
dashboard.security.login.max-tracked-ips=${DASHBOARD_LOGIN_MAX_TRACKED_IPS:10000}
